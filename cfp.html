      <p>
       The 10th Nonlinear Systems and Control Conference is scheduled to be held from August 18th to 21th, 2025, in Shanghai, China. Sponsored by Tongji University and the Technical Committee on Control Theory, Chinese Association of Automation, this conference aims to provide a broad academic exchange platform for domestic and international scholars and relevant engineering and technical personnel in the field of nonlinear systems and control, showcasing the latest theoretical and technological achievements. The theme of this year's conference will focus on the new developments in the field of nonlinear systems and control research. The conference will include plenary sessions, keynote speeches, invited sessions, and poster sessions for communication. Submission types include full papers and extended abstracts, which can be in Chinese or English. Some excellent papers will be recommended for publication in special issues of journals such as <i>Control Theory & Applications</i>.
