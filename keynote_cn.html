          </td>

        <tr>
          <td>
            <b>摘要</b>: 
            数据传输延迟和数据丢包是网络化反馈系统中常见的现象，这不仅可能导致系统性能降低，甚至可能破坏系统的稳定性。针对这一问题，人们在过去二十多年中进行了大量的研究工作，并取得了可喜的进展。为了处理有信道随机时延引起的数据乱序等问题，我们提出线性数据接收策略，并以信道随机脉冲响应为基础，建立了基于这类数据接收策略的信道模型。该模型提供了一种全新的信道不确定性描述，包含随机输入输出模型和状态空间模型两种形式，为完整描述信道中数据传输的全过程提供了有效的方法。我们的研究表明当采用线性数据接收策略时，上述随机信道的输入输出模型具有一阶、二阶统计意义下的线性时不变性质。基于信道的统计特性，我们定义了信道随机偏差的度量--频域变异响应，其描述了二次统计意义下每一频点上信道随机不确定性相对大小。在此基础上，我们研究了具有随机数据传输延迟或数据丢包信道的网络化线性反馈系统的均方稳定性，得到了网络化反馈系统均方稳定性充分必要条件的输入输出形式和状态空间形式。这些条件阐明了在均方稳定性问题中，网络系统的标称模型与信道模型频域变异响应之间的相互制约关系。为了保证上述网络化反馈系统的均方稳定性，标称系统与信道不确定性构成的回路其均方增益必须小于一。此外，这些稳定性条件还表明，由随机传输时延引起的信道不确定性可以看成时一个有色乘性算子，该算子可以用信道频域变异响应来表征。上述均方稳定性条件是经典的均方小增益定理的推广，我们称之为有色均方小增益定理。根据这一结果，我们可进一步得到这类系统均方稳定控制器和均方最优控制器的设计方法。 
          </td>
        </tr>

          </td>

        <tr>
          <td>
            <b>摘要</b>: 
            偏微分系统描述的是无穷维的系统。一个保持时间不变，空间变量离散的格式，通常称为半离散格式，把一个偏微分方程离散成常微分方程。但在这个离散过程中，许多原来偏微分系统的控制特性难以一致的保持。这些性质中最主要的一个性质是稳定性。1990年初期就已经知道，即使一个指数稳定的线性偏微分方程系统，半离散格式虽然对固定的离散步长仍然是指数稳定的，但衰减律却随步长趋于零而趋于零， 即一致指数稳定性不能成立。过去几年， 我们发展了一种基于降阶的差分格式，证明了这种格式有非常明显的优势。第一，半离散格式一致指数稳定；第二，一直指数稳定的证明非常类似原来偏微分系统的指数稳定的证明；第三，适合任何的边界条件。 本报告介绍这一格式对运动欧拉-伯努利梁在边界非线性反馈控制下半离散格式的一致指数稳定性。 
          </td>

        <tr>
          <td><b>题目</b>: 
            学习修剪多参数二次规划
          </td>
        </tr> 
        <tr>
          <td>
            <b>摘要</b>: 
            在广泛的应用问题中，我们需要基于有限计算资源来快速求解一系列带有许多线性不等式的凸多参数二次规划（mp-QPs）。该问题长期以来一直是控制与优化领域的研究热点。注意到mp-QP的大多数不等式约束是冗余的，即删除它们不会改变原问题的最优解，且现有QP求解算法的主要计算成本在于处理这些不等式约束。为此，本工作通过学习已求解过的mp-QP，提出了一种对（待求解的）mp-QP冗余不等式的可靠且廉价删除方法，并严格刻画了冗余不等式的删除个数与两个mp-QPs“距离”之间的定量关系。进一步，该方法用于修剪线性二次模型预测控制（MPC）的mp-QP。通过学习离/在线求解过的mp-QP，实现了闭环系统中（待求解）的mp-QP自适应修剪，并证明了修剪后的mp-QP不等式的数量在有限的时间步长内减少到零。最后，数值结果验证了所提学习修剪方法在删除冗余不等式约束方面的优势。
          </td>
        </tr>
        <tr>
         </tr>
      </table>

          <td>
            <b>摘要</b>: 
            系统辨识是研究基于观测到的输入输出信号构建动态系统数学模型的一个研究领域，其不但是控制理论中的一个重要研究方向，也是控制工程中的一项基本技术。然而，系统辨识在很大程度上一直坚持最大似然（或相关）方法为框架，为了应对日益增长的需求，需要吸收其他领域新技术的精髓，推动系统辨识的方法、算法和理论的进一步发展。在过去十年中，系统辨识领域的一项主要进展是所谓的正则化系统辨识。正则化方法在统计和机器学习中被广泛用于处理偏差-方差权衡和诱导稀疏性。研究表明，正则化方法在系统辨识中的模型估计和寻找稀疏解的问题上可以优于经典方法。本次报告的目的是介绍正则化系统辨识的基本思想。
          </td>

        <tr>
          <td>
            <b>摘要</b>: 
            多智能体系统实际应用广泛，因而其协同控制理论研究备受关注。本报告将介绍团队在这一领域的系列研究成果，重点关注智能体动态、网络结构和通信机制这三个关键要素。报告将首先介绍多智能体系统事件触发控制的基本概念，展示其在减少不必要通信和控制更新方面的优势。接着，将概述团队在同构/异构线性多智能体系统基于事件触发的分布式/完全分布式协同控制理论方面的研究成果。随后，将详细介绍在切换通信网络条件下，异构线性多智能体系统输出一致性问题的最新研究进展。所提出的控制策略不仅能减少多智能体系统的通信需求，节省宝贵的通信资源，同时能确保控制目标的实现，还可以避免多智能体之间的连续监测和芝诺现象（即在有限时间内触发无限次事件的病态现象）。团队的研究成果推进了协同控制理论的发展，有效弥合了理论与复杂实际应用条件之间的差异，从而提升了理论的实用性。
